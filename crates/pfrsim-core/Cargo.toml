[package]
name = "pfrsim-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "In-process computational engine, timeseries forecasting, and Nelder-Mead PFVI calibration for pfrsim"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
rusqlite = { version = "0.37", features = ["bundled"] }
thiserror = "2.0"
parking_lot = "0.12"
burn = { version = "0.21", features = ["ndarray", "wgpu", "train"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["sync", "rt", "macros"] }
statrs = "0.19.1"
smartcore = "0.6.14"
calamine = "0.36"
polars = { version = "0.55", default-features = false, features = ["csv", "parquet", "fmt"] }

[dev-dependencies]
tempfile = "3"

[[bench]]
name = "pipeline_matrix"
harness = false
