[package]
name = "pfrsim-desktop"
version = "0.1.0"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pfrsim-core = { path = "../crates/pfrsim-core" }
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
parking_lot = "0.12"
serde_json = "1.0"
tokio = { version = "1", features = ["sync", "rt", "macros"] }
hex = "0.4"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
rfd = "0.15"
wgpu = "29.0.4"
