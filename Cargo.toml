[workspace]
resolver = "2"
members = [
    "crates/pfrsim-core",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Akin01 <Akinpasha82@gmail.com>"]
repository = "https://github.com/akin01/pfrsim"
homepage = "https://github.com/akin01/pfrsim"
documentation = "https://github.com/akin01/pfrsim#readme"
readme = "README.md"
description = "High-performance Tropical Peatland Fire Risk Simulator desktop application with 3D peatland moisture rendering, deep learning forecasting (Burn LSTM & GRU), and in-process Rust numerics engine."
keywords = ["peatland", "fire-risk", "simulator", "tauri", "burn"]
categories = ["science", "simulation", "gui", "algorithms"]

[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = 0

[profile.dev.package.pfrsim-core]
opt-level = 2

[profile.bench]
opt-level = 2
debug = 0

[profile.bench.package."*"]
opt-level = 2
debug = 0
